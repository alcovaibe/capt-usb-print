name: Exact Office corresponding sources
on:
  workflow_call:
permissions:
  contents: read
jobs:
  corresponding-sources:
    name: Exact native sources and notices
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install exact NDK runtime for notice and byte verification
        run: sdkmanager --install 'ndk;29.0.14206865'
      - uses: actions/checkout@v4
        with:
          path: capt
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: LibreOffice/core
          ref: 8221e31b3ac356a1623c672912a3d2b492f7e3d1
          path: libreoffice-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: liberationfonts/liberation-sans-narrow
          ref: 5462920fee502b688604472e65af49af951bdd56 # 1.07.6, editable SFD source
          path: narrow-source
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: libreoffice-native-*
          path: native-archives
          merge-multiple: true
      - name: Verify all packages and bundle exact corresponding sources
        run: |
          mkdir packages
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir "packages/$abi"
            tar -xzf "native-archives/capt-office-$abi.tar.gz" -C "packages/$abi"
            python3 capt/tools/prepare-office-notices.py "packages/$abi"
          done
          python3 capt/tools/package-office-sources.py packages libreoffice-source narrow-source office-corresponding-sources.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: office-corresponding-sources
          path: |
            office-corresponding-sources.tar.gz
            office-corresponding-sources.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error
