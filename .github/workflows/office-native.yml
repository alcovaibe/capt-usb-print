name: LibreOffice Android source build probe
on:
  pull_request:
    paths:
      - 'config/office/**'
      - 'tools/office/**'
      - '.github/workflows/office-native.yml'
      - 'app/src/officeProbe/**'
      - 'app/src/main/java/org/libreoffice/**'
      - 'app/src/main/java/com/cryonum/captusbprint/DocumentActivity.kt'
      - 'app/src/main/java/com/cryonum/captusbprint/DocumentIntake.kt'
      - '.github/workflows/office-packages.yml'
      - 'tools/assemble-office-engine.py'
      - 'app/src/main/java/com/cryonum/captusbprint/office/**'
      # These owners/geometry paths also change Office preview and held queue copies.
      - 'app/src/main/java/com/cryonum/captusbprint/document/**'
      - 'app/src/main/java/com/cryonum/captusbprint/queue/**'
      - 'app/src/main/java/com/cryonum/captusbprint/core/JobSpecification.kt'
      - 'app/src/main/java/com/cryonum/captusbprint/CaptApplication.kt'
      - 'app/src/main/java/com/cryonum/captusbprint/DocumentPreviewPanel.kt'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/cpp/office_limits*'
      - 'app/src/main/cpp/office_sandbox*'
      - 'app/src/main/cpp/CMakeLists.txt'
      - 'app/src/main/res/values/office_strings.xml'
      - 'app/build.gradle.kts'
      - 'tools/run-office-engine-smoke.sh'
      - 'tools/run-office-worker-smoke.sh'
      - 'tools/run-office-uri-owner-death.sh'
      - 'app/src/debug/java/com/cryonum/captusbprint/OfficeUriSmoke.kt'
      - 'app/src/debug/java/com/cryonum/captusbprint/OfficeResourceStressSmoke.kt'
      - 'tools/check-office-work-budget.sh'
      - 'tools/OfficeWorkBudgetCheck.java'
      - 'office-uri-fixture/**'
      - 'tools/check-office-fit-pdfs.py'
      - 'tools/measure-office-probe-apk.py'
      - 'tools/check-office-extended-pdfs.py'
      - 'tools/prepare-office-notices.py'
      - 'tools/package-office-sources.py'
      - 'config/office-fonts.json'
      - 'app/src/main/assets/office-font-aliases.xml'
      - 'app/src/debug/assets/office-fixtures/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  engine:
    uses: ./.github/workflows/office-packages.yml
  conversion-probe:
    name: LibreOffice synthetic conversion API ${{ matrix.api }}
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: libreoffice-native-x86_64
          path: engine-archive
      - name: Unpack this run's pinned native build
        run: |
          mkdir office-engine
          tar -xzf engine-archive/capt-office-x86_64.tar.gz -C office-engine
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install synthetic PDF text verifier
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Build opt-in probe APK preserving main permissions
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'ndk;29.0.14206865' 'cmake;3.22.1'
          python3 tools/prepare-office-notices.py office-engine
          bash ./gradlew --no-daemon -PofficeEngineDir="$PWD/office-engine" -PofficeAbis=x86_64 :app:assembleDebug :app:lintDebug
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk > probe-permissions.txt
          grep -F 'android.permission.INTERNET' probe-permissions.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex packages --defined-only app/build/outputs/apk/debug/app-debug.apk > probe-dex.txt
          grep -F 'com.cryonum.captusbprint.OfficeEngineSmoke' probe-dex.txt
          python3 tools/measure-office-probe-apk.py app/build/outputs/apk/debug/app-debug.apk office-probe-apk-size.json
      - name: Free unused runner toolchains
        run: bash tools/free-runner-disk.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          pre-emulator-launch-script: bash tools/prepare-emulator.sh
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 2048
          disable-animations: true
          script: |
            adb shell getprop ro.build.version.sdk | tr -d '\r' | grep -x '${{ matrix.api }}'
            adb install app/build/outputs/apk/debug/app-debug.apk
            bash tools/run-office-engine-smoke.sh
            bash tools/run-office-worker-smoke.sh resources
            bash tools/run-office-worker-smoke.sh
            bash tools/run-office-worker-smoke.sh sandbox
            python3 tools/check-office-fit-pdfs.py office-layout-synthetic.tar office-worker-results.json
            bash tools/run-office-worker-smoke.sh native-ui
            bash tools/run-office-worker-smoke.sh extended
            python3 tools/check-office-extended-pdfs.py office-extended-synthetic.tar office-extended-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-conversion-probe-api-${{ matrix.api }}
          path: |
            office-engine-smoke.txt
            office-probe-results.json
            office-probe-stage.txt
            office-engine-logcat.txt
            office-engine-crash.txt
            probe-dex.txt
            office-probe-apk-size.json
            office-formula-policy.json
            office-worker-*.txt
            office-sandbox-*.txt
            office-resources-*.txt
            office-worker-results.json
            office-native-ui-*.txt
            office-layout-synthetic.tar
            office-extended-*.txt
            office-extended-results.json
            office-extended-synthetic.tar
            office-font-fallback-observed.json
          if-no-files-found: ignore
          retention-days: 7
