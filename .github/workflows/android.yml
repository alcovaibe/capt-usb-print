name: CAPT USB Print checks and signed prerelease
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Verify vendored HISCOA codec on host
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -I app/src/main/cpp/upstream \
            tools/hiscoa-smoke.c \
            app/src/main/cpp/upstream/hiscoa-compress.c \
            app/src/main/cpp/upstream/hiscoa-common.c \
            -o /tmp/capt-hiscoa-smoke
          /tmp/capt-hiscoa-smoke
      - name: Validate release and emulator setup scripts
        run: |
          python3 -m py_compile tools/prepare-signing.py tools/signed-release.py
          bash -n tools/prepare-emulator.sh tools/free-runner-disk.sh
          # Reproduce duplicate partition-size entries from a device profile.
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/test.avd"
          printf 'hw.cpu.ncore=2\ndisk.dataPartition.size=7200M\ndisk.dataPartition.size=2048M\n' > "$fixture/test.avd/config.ini"
          CAPT_SKIP_DISK_CHECK=1 ANDROID_AVD_HOME="$fixture" bash tools/prepare-emulator.sh
          test "$(grep -c '^disk.dataPartition.size=' "$fixture/test.avd/config.ini")" -eq 1
          grep -Fx 'disk.dataPartition.size=2048M' "$fixture/test.avd/config.ini"
          grep -Fx 'hw.cpu.ncore=2' "$fixture/test.avd/config.ini"
          rm -rf "$fixture"
      - name: Verify JSON is shared only after explicit button press
        run: python3 tools/check-manual-json-sharing.py
      - name: Build, lint and tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Verify permissions and APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libcapt_hiscoa.so'
          unzip -l "$APK" | grep -q 'lib/x86_64/libcapt_hiscoa.so'
          if grep -E 'android.permission.INTERNET|android.permission.READ_EXTERNAL_STORAGE|android.permission.MANAGE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml; then
            echo "Unexpected permission in source manifest"; exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee apk-permissions.txt
          if grep -E 'android.permission.(INTERNET|READ_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE)' apk-permissions.txt; then
            echo "Unexpected merged APK permission"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: capt-usb-print-a1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  emulator-preflight:
    name: Android 16 install and offline raster smoke on PR
    needs: android
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: capt-usb-print-a1-debug
          path: pr-apk
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Free unrelated GitHub runner toolchains
        run: bash tools/free-runner-disk.sh
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 16 and verify ADB connectivity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          disk-size: 2048M
          pre-emulator-launch-script: bash tools/prepare-emulator.sh
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 2048
          disable-animations: true
          script: |
            adb shell getprop sys.boot_completed | tr -d '\r' | grep -x '1'
            adb shell getprop ro.build.version.sdk | tr -d '\r' | grep -x '36'
            adb install pr-apk/app-debug.apk
            adb shell am start -W -n com.cryonum.captusbprint.debug/com.cryonum.captusbprint.MainActivity
            adb shell am instrument -w com.cryonum.captusbprint.debug/com.cryonum.captusbprint.StageCRasterSmoke | tee /tmp/capt-raster-smoke.txt
            grep -F 'CAPT_STAGE_C_RASTER_SMOKE_PASSED' /tmp/capt-raster-smoke.txt

  signing-availability:
    name: Owner signing configuration
    needs: android
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          PRESENT: ${{ secrets.ANDROID_SIGNING != '' }}
        run: |
          echo "enabled=$PRESENT" >> "$GITHUB_OUTPUT"
          if [ "$PRESENT" != 'true' ]; then
            echo "::notice::Signed release skipped until owner installs ANDROID_SIGNING secret in private repository Settings."
          fi

  signed-release:
    name: Permanent-key signed APK and in-place upgrade
    needs: [android, signing-availability]
    if: needs.signing-availability.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Allocate monotonically increasing signed versionCode
        run: echo "APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Restore owner's permanent key to temporary secure runner directory
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: python3 tools/prepare-signing.py
      - name: Lint and build signed non-debuggable APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:lintRelease :app:assembleRelease
      - name: Verify APK signature, stable package, prior release and versionCode
        run: python3 tools/signed-release.py verify
      - name: Verify forbidden Android permissions
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" > release-output/permissions.txt
          if grep -E 'android.permission.(INTERNET|READ_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE)' release-output/permissions.txt; then
            echo "Unexpected release APK permission"; exit 1
          fi
      - name: Free unrelated GitHub runner toolchains before emulator
        run: bash tools/free-runner-disk.sh
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check space before Android 16 emulator
        run: |
          df -h "$HOME" "$RUNNER_TEMP"
          df -i "$HOME" "$RUNNER_TEMP"
      - name: Verify initial install or in-place upgrade on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          # Keep AVD userdata modest; this does NOT replace host free-space
          # cleanup: emulator 37.2.12 requires ~7.37 GB free on the host even
          # when configured with a 2 GiB userdata partition.
          disk-size: 2048M
          # The runner appends disk-size; normalize duplicate AVD config keys
          # and assert adequate real disk headroom before launching.
          pre-emulator-launch-script: bash tools/prepare-emulator.sh
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 2048
          disable-animations: true
          script: bash tools/emulator-upgrade-check.sh
      - name: Publish verified signed APK only after emulator success
        run: python3 tools/signed-release.py publish
      - name: Upload nonsecret release and upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CAPT-USB-Print-signed-release-checks
          path: release-output/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/capt-usb-print-release.p12"

